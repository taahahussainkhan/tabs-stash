name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate Fullstack Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Server Build
        run: |
          cd server
          npm ci
          npm run build

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

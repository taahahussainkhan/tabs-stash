name: Package & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v2.1.0)'
        required: true
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Extension Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Build Clean Folder Zip Packages for Chrome & Firefox
        run: |
          mkdir -p releases
          mkdir -p dist_pkg/tabvault-chrome
          mkdir -p dist_pkg/tabvault-firefox

          # Stage Chrome package from extension/
          cp -r extension/* dist_pkg/tabvault-chrome/
          cd dist_pkg && zip -r "../releases/tabvault-chrome-${{ env.TAG }}.zip" tabvault-chrome && cd ..

          # Stage Firefox package from extension/
          cp -r extension/* dist_pkg/tabvault-firefox/
          cd dist_pkg && zip -r "../releases/tabvault-firefox-${{ env.TAG }}.zip" tabvault-firefox && cd ..

          ls -la releases

      - name: Publish GitHub Release with Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: TabVault ${{ env.TAG }} - Cross-Browser Tab Stash
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            releases/tabvault-chrome-${{ env.TAG }}.zip
            releases/tabvault-firefox-${{ env.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
